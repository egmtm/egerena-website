---
# ─────────────────────────────────────────────────────────────────
# egerena.com — cPanel Git Auto-Deploy Configuration
# ─────────────────────────────────────────────────────────────────
#
# This file controls what gets deployed to the live server when
# cPanel pulls the `live` branch.
#
# CRITICAL SECURITY MODEL: explicit allowlist only.
# Every deployable file is listed individually below.
# Files NOT listed here are NEVER touched by the deploy.
#
# Files intentionally EXCLUDED (managed manually on server):
#   - config.php           (SMTP secrets, chmod 600)
#   - phpmailer/           (third-party library, manually updated)
#   - games/game001-scores.json     (runtime leaderboard data)
#   - games/game001-ratelimit.json  (runtime rate-limit data)
#
# Files intentionally EXCLUDED (repo-only, not server-deployable):
#   - README.md            (repo documentation)
#   - THIRD_PARTY.md       (repo documentation)
#   - fonts/README.md      (repo documentation)
#   - .gitignore           (Git config)
#   - .cpanel.yml          (this file)
#
# DEPLOYPATH: Production — deploys directly to live site.
# Changed from staging_deploy/ after Group 2A verification passed.
#
# See README.md for full deploy flow context.
# See THIRD_PARTY.md for excluded-file rationale.
# ─────────────────────────────────────────────────────────────────

deployment:
  tasks:
    # DEPLOYPATH: production at /home1/aigigvmy/public_html/
    - export DEPLOYPATH=/home1/aigigvmy/public_html/

    # ── Ensure target subdirectories exist ──────────────────────
    - /bin/mkdir -p ${DEPLOYPATH}apps/
    - /bin/mkdir -p ${DEPLOYPATH}apps/es/
    - /bin/mkdir -p ${DEPLOYPATH}apps/de/
    - /bin/mkdir -p ${DEPLOYPATH}apps/fr/
    - /bin/mkdir -p ${DEPLOYPATH}apps/it/
    - /bin/mkdir -p ${DEPLOYPATH}apps/pt/
    - /bin/mkdir -p ${DEPLOYPATH}apps/nl/
    - /bin/mkdir -p ${DEPLOYPATH}apps/ru/
    - /bin/mkdir -p ${DEPLOYPATH}apps/ja/
    - /bin/mkdir -p ${DEPLOYPATH}apps/ar/
    - /bin/mkdir -p ${DEPLOYPATH}games/
    - /bin/mkdir -p ${DEPLOYPATH}fonts/
    - /bin/mkdir -p ${DEPLOYPATH}fonts/bricolage-grotesque/
    - /bin/mkdir -p ${DEPLOYPATH}fonts/cormorant-garamond/
    - /bin/mkdir -p ${DEPLOYPATH}fonts/dm-mono/
    - /bin/mkdir -p ${DEPLOYPATH}fonts/jetbrains-mono/
    - /bin/mkdir -p ${DEPLOYPATH}fonts/outfit/
    - /bin/mkdir -p ${DEPLOYPATH}fonts/share-tech-mono/
    - /bin/mkdir -p ${DEPLOYPATH}fonts/vt323/

    # ── Root files ──────────────────────────────────────────────
    - /bin/cp .htaccess ${DEPLOYPATH}
    - /bin/cp 403.html ${DEPLOYPATH}
    - /bin/cp 404.html ${DEPLOYPATH}
    - /bin/cp 500.html ${DEPLOYPATH}
    - /bin/cp app.js ${DEPLOYPATH}
    - /bin/cp egm-logo.svg ${DEPLOYPATH}
    - /bin/cp icon-192.png ${DEPLOYPATH}
    - /bin/cp icon-512.png ${DEPLOYPATH}
    - /bin/cp index.html ${DEPLOYPATH}
    - /bin/cp quote-form-handler.php ${DEPLOYPATH}
    - /bin/cp robots.txt ${DEPLOYPATH}
    - /bin/cp sitemap.xml ${DEPLOYPATH}
    - /bin/cp style.css ${DEPLOYPATH}
    - /bin/cp version.json ${DEPLOYPATH}

    # ── /apps/ — desktop app product pages ──────────────────────
    - /bin/cp apps/.htaccess ${DEPLOYPATH}apps/
    - /bin/cp apps/egm-theme.js ${DEPLOYPATH}apps/
    - /bin/cp apps/egm.css ${DEPLOYPATH}apps/
    - /bin/cp apps/egm.html ${DEPLOYPATH}apps/
    - /bin/cp apps/egm-downloader.css ${DEPLOYPATH}apps/
    - /bin/cp apps/egm-downloader.html ${DEPLOYPATH}apps/
    - /bin/cp apps/egm-downloader.js ${DEPLOYPATH}apps/
    - /bin/cp apps/es/egm-downloader.html ${DEPLOYPATH}apps/es/
    - /bin/cp apps/de/egm-downloader.html ${DEPLOYPATH}apps/de/
    - /bin/cp apps/fr/egm-downloader.html ${DEPLOYPATH}apps/fr/
    - /bin/cp apps/it/egm-downloader.html ${DEPLOYPATH}apps/it/
    - /bin/cp apps/pt/egm-downloader.html ${DEPLOYPATH}apps/pt/
    - /bin/cp apps/nl/egm-downloader.html ${DEPLOYPATH}apps/nl/
    - /bin/cp apps/ru/egm-downloader.html ${DEPLOYPATH}apps/ru/
    - /bin/cp apps/ja/egm-downloader.html ${DEPLOYPATH}apps/ja/
    - /bin/cp apps/ar/egm-downloader.html ${DEPLOYPATH}apps/ar/
    - /bin/cp apps/egmac-glass.css ${DEPLOYPATH}apps/
    - /bin/cp apps/egmac-theme.js ${DEPLOYPATH}apps/
    - /bin/cp apps/egmac.html ${DEPLOYPATH}apps/
    - /bin/cp apps/egml-color.js ${DEPLOYPATH}apps/
    - /bin/cp apps/egml.css ${DEPLOYPATH}apps/
    - /bin/cp apps/egml.html ${DEPLOYPATH}apps/
    - /bin/cp apps/index.css ${DEPLOYPATH}apps/
    - /bin/cp apps/index.html ${DEPLOYPATH}apps/
    - /bin/cp apps/matrix.js ${DEPLOYPATH}apps/
    # apps/.stars-cache.json INTENTIONALLY EXCLUDED (runtime data written by stars.php)
    - /bin/cp apps/stars.php ${DEPLOYPATH}apps/
    - /bin/cp apps/egm-version.json ${DEPLOYPATH}apps/
    - /bin/cp apps/egm-portable-version.json ${DEPLOYPATH}apps/
    - /bin/cp apps/egmac-update.json ${DEPLOYPATH}apps/
    - /bin/cp apps/egmlinux-update.json ${DEPLOYPATH}apps/
    # app icons: favicon (16, 32, 192), apple touch icon (180) and link preview image (512) on the app pages
    - /bin/cp apps/egm-icon-16.png ${DEPLOYPATH}apps/
    - /bin/cp apps/egm-icon-32.png ${DEPLOYPATH}apps/
    - /bin/cp apps/egm-icon-180.png ${DEPLOYPATH}apps/
    - /bin/cp apps/egm-icon-192.png ${DEPLOYPATH}apps/
    - /bin/cp apps/egm-icon-512.png ${DEPLOYPATH}apps/

    # ── /games/ — games hub + STDERR ────────────────────────────
    # game001-scores.json INTENTIONALLY EXCLUDED (runtime data)
    # game001-ratelimit.json INTENTIONALLY EXCLUDED (runtime data)
    - /bin/cp games/game001-scores.php ${DEPLOYPATH}games/
    - /bin/cp games/game001.html ${DEPLOYPATH}games/
    - /bin/cp games/index.css ${DEPLOYPATH}games/
    - /bin/cp games/index.html ${DEPLOYPATH}games/
    - /bin/cp games/index.js ${DEPLOYPATH}games/

    # ── /fonts/ — self hosted site fonts (SIL OFL 1.1, LICENSE kept next to each family) ──
    # fonts/README.md INTENTIONALLY EXCLUDED (repo documentation)
    - /bin/cp fonts/bricolage-grotesque/LICENSE ${DEPLOYPATH}fonts/bricolage-grotesque/
    - /bin/cp fonts/bricolage-grotesque/bricolage-grotesque-latin-ext-opsz-normal.woff2 ${DEPLOYPATH}fonts/bricolage-grotesque/
    - /bin/cp fonts/bricolage-grotesque/bricolage-grotesque-latin-opsz-normal.woff2 ${DEPLOYPATH}fonts/bricolage-grotesque/
    - /bin/cp fonts/cormorant-garamond/LICENSE ${DEPLOYPATH}fonts/cormorant-garamond/
    - /bin/cp fonts/cormorant-garamond/cormorant-garamond-latin-ext-wght-italic.woff2 ${DEPLOYPATH}fonts/cormorant-garamond/
    - /bin/cp fonts/cormorant-garamond/cormorant-garamond-latin-ext-wght-normal.woff2 ${DEPLOYPATH}fonts/cormorant-garamond/
    - /bin/cp fonts/cormorant-garamond/cormorant-garamond-latin-wght-italic.woff2 ${DEPLOYPATH}fonts/cormorant-garamond/
    - /bin/cp fonts/cormorant-garamond/cormorant-garamond-latin-wght-normal.woff2 ${DEPLOYPATH}fonts/cormorant-garamond/
    - /bin/cp fonts/dm-mono/LICENSE ${DEPLOYPATH}fonts/dm-mono/
    - /bin/cp fonts/dm-mono/dm-mono-latin-300-normal.woff2 ${DEPLOYPATH}fonts/dm-mono/
    - /bin/cp fonts/dm-mono/dm-mono-latin-400-normal.woff2 ${DEPLOYPATH}fonts/dm-mono/
    - /bin/cp fonts/dm-mono/dm-mono-latin-500-normal.woff2 ${DEPLOYPATH}fonts/dm-mono/
    - /bin/cp fonts/dm-mono/dm-mono-latin-ext-300-normal.woff2 ${DEPLOYPATH}fonts/dm-mono/
    - /bin/cp fonts/dm-mono/dm-mono-latin-ext-400-normal.woff2 ${DEPLOYPATH}fonts/dm-mono/
    - /bin/cp fonts/dm-mono/dm-mono-latin-ext-500-normal.woff2 ${DEPLOYPATH}fonts/dm-mono/
    - /bin/cp fonts/fonts.css ${DEPLOYPATH}fonts/
    - /bin/cp fonts/jetbrains-mono/LICENSE ${DEPLOYPATH}fonts/jetbrains-mono/
    - /bin/cp fonts/jetbrains-mono/jetbrains-mono-latin-ext-wght-normal.woff2 ${DEPLOYPATH}fonts/jetbrains-mono/
    - /bin/cp fonts/jetbrains-mono/jetbrains-mono-latin-wght-normal.woff2 ${DEPLOYPATH}fonts/jetbrains-mono/
    - /bin/cp fonts/outfit/LICENSE ${DEPLOYPATH}fonts/outfit/
    - /bin/cp fonts/outfit/outfit-latin-ext-wght-normal.woff2 ${DEPLOYPATH}fonts/outfit/
    - /bin/cp fonts/outfit/outfit-latin-wght-normal.woff2 ${DEPLOYPATH}fonts/outfit/
    - /bin/cp fonts/share-tech-mono/LICENSE ${DEPLOYPATH}fonts/share-tech-mono/
    - /bin/cp fonts/share-tech-mono/share-tech-mono-latin-400-normal.woff2 ${DEPLOYPATH}fonts/share-tech-mono/
    - /bin/cp fonts/vt323/LICENSE ${DEPLOYPATH}fonts/vt323/
    - /bin/cp fonts/vt323/vt323-latin-400-normal.woff2 ${DEPLOYPATH}fonts/vt323/
    - /bin/cp fonts/vt323/vt323-latin-ext-400-normal.woff2 ${DEPLOYPATH}fonts/vt323/

    # ── /.well-known/ — security.txt (RFC 8615) ─────────────────
    - /bin/mkdir -p ${DEPLOYPATH}.well-known/
    - /bin/cp .well-known/security.txt ${DEPLOYPATH}.well-known/

    # ── Done ────────────────────────────────────────────────────
    - /bin/echo "✅ egerena.com deploy complete — $(date '+%Y-%m-%d %H:%M:%S %Z')"
