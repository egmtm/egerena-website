<!DOCTYPE html>
<html lang="en" data-theme="slate">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>500 – Server Error</title>
  <link rel="icon" type="image/png" href="./icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./style.css"/>
  <style>
    .error-code{font-family:'Cormorant Garamond',serif;font-size:4rem;font-weight:300;color:var(--muted);margin-bottom:1rem}
    .error-msg{font-size:.9rem;line-height:1.9;letter-spacing:.03em;color:var(--muted);max-width:360px;margin-bottom:2rem}
    .home-link{font-size:.72rem;letter-spacing:.14em;color:var(--tag-fg);text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;transition:color .3s}
    .home-link .arrow{transition:transform .3s}
    .home-link:hover{color:var(--fg)}
    .home-link:hover .arrow{transform:translateX(4px)}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-wrap">
<svg class="egm-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 96" role="img" aria-label="EGerena.com" preserveAspectRatio="xMidYMid meet">
        <title>EGerena.com</title>
        <g class="egm-mark">
          <rect x="0"   y="10" width="11" height="76"/>
          <rect x="0"   y="10" width="54" height="11"/>
          <rect x="0"   y="42" width="40" height="10"/>
          <rect x="0"   y="75" width="54" height="11"/>
          <rect x="66"  y="10" width="11" height="76"/>
          <rect x="66"  y="10" width="54" height="11"/>
          <rect x="66"  y="75" width="54" height="11"/>
          <rect x="108" y="48" width="12" height="38"/>
          <rect x="94"  y="42" width="26" height="10"/>
        </g>
        <circle cx="116" cy="10" r="7" fill="#c9a84c"/>
        <rect class="egm-divider" x="136" y="18" width="1.5" height="60" opacity="0.35"/>
        <text class="egm-wordmark" x="148" y="62" font-family="'DM Mono', monospace" font-size="28" font-weight="300" letter-spacing="0.03em">erena.com</text>
      </svg>
    </div>
    <p class="error-code">500</p>
    <p class="error-msg">Something went wrong on our end. Please try again later.</p>
    <a class="home-link" href="/">
      <span class="arrow">←</span><span>Back to Home</span>
    </a>
  </main>
</body>
</html>
