  <!-- Quote Form Modal -->
  <div class="modal-overlay" id="quoteModal">
    <div class="modal-content">
      <button class="modal-close" id="closeModal" aria-label="Close">&times;</button>
      <h2 class="modal-title" id="modalTitle">Consulting Quote</h2>
      
      <form id="quoteForm" class="quote-form" method="POST" action="./quote-form-handler.php">
        <!-- Basic Info -->
        <div class="form-section">
          <div class="form-group">
            <label for="formName" id="labelName">Name *</label>
            <input type="text" id="formName" name="name" autocomplete="name" required>
          </div>
          
          <div class="form-group">
            <label for="formEmail" id="labelEmail">Email *</label>
            <input type="email" id="formEmail" name="email" autocomplete="email" required>
          </div>
          
          <div class="form-group">
            <label for="formCompany" id="labelCompany">Company/Organization</label>
            <input type="text" id="formCompany" name="company" autocomplete="organization">
          </div>
        </div>

        <!-- Purpose -->
        <div class="form-section">
          <label class="form-label-main" id="labelPurpose">Purpose * (select all that apply)</label>
          <div class="checkbox-grid">
            <label class="checkbox-label">
              <input type="checkbox" name="purpose[]" value="web_design">
              <span id="purposeWebDesign">Web Design</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose[]" value="graphic_branding">
              <span id="purposeGraphic">Graphic Design / Branding</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose[]" value="custom_app">
              <span id="purposeApp">Custom Application</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose[]" value="ui_ux">
              <span id="purposeUIUX">UI/UX Design</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose[]" value="media_production">
              <span id="purposeMedia">Media Production (Audio/Video)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose[]" value="music_podcast">
              <span id="purposeMusic">Music/Podcast Production</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose[]" value="album_art">
              <span id="purposeAlbum">Album Art</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose[]" value="it_consulting">
              <span id="purposeIT">IT Consulting</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose[]" value="business_consulting">
              <span id="purposeBusiness">Business Consulting</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose[]" value="security_consulting">
              <span id="purposeSecurity">Security Consulting</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose[]" value="other" id="purposeOtherCheckbox">
              <span id="purposeOtherLabel">Other</span>
            </label>
          </div>
          <div class="form-group form-other-hidden" id="otherPurposeGroup">
            <input type="text" id="formOtherPurpose" name="other_purpose" placeholder="Please specify...">
          </div>
        </div>

        <!-- Description -->
        <div class="form-section">
          <div class="form-group">
            <label for="formDescription" id="labelDescription">Brief Description *</label>
            <textarea id="formDescription" name="description" rows="4" minlength="120" maxlength="1500" required></textarea>
          </div>
        </div>

        <!-- Budget & Timeline -->
        <div class="form-section form-row">
          <div class="form-group">
            <label for="formBudget" id="labelBudget">Budget Range</label>
            <select id="formBudget" name="budget">
              <option value="" id="budgetSelect">Select one...</option>
              <option value="under_500" id="budgetUnder500">Under $500</option>
              <option value="500_2000" id="budget500">$500 - $2,000</option>
              <option value="2000_5000" id="budget2000">$2,000 - $5,000</option>
              <option value="5000_10000" id="budget5000">$5,000 - $10,000</option>
              <option value="other" id="budgetOther">Other</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="formTimeline" id="labelTimeline">Timeline</label>
            <select id="formTimeline" name="timeline">
              <option value="" id="timelineSelect">Select one...</option>
              <option value="asap" id="timelineASAP">ASAP</option>
              <option value="1_3_months" id="timeline1">1-3 months</option>
              <option value="3_6_months" id="timeline3">3-6 months</option>
              <option value="6_plus_months" id="timeline6">6+ months</option>
              <option value="flexible" id="timelineFlexible">Flexible</option>
            </select>
          </div>
        </div>

        <!-- Honeypot (spam protection) -->
        <input type="text" name="website" class="honeypot-field" tabindex="-1" autocomplete="off">

        <!-- Turnstile -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAADMwV8lyA4xxRN3b" data-theme="auto" style="margin-bottom:1rem;"></div>

        <!-- Submit -->
        <div class="form-actions">
          <button type="submit" class="form-submit" id="submitBtn">
            <span id="submitText">Send Quote Request</span>
          </button>
        </div>

        <!-- Messages -->
        <div class="form-message form-message-hidden" id="formMessage"></div>
      </form>
    </div>
