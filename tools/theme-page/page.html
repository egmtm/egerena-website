<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGM Downloader Themes: try every theme</title>
    <meta name="description" content="Preview every EGM Downloader theme on the app's real layout.">
    <meta name="author" content="egerena.com">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://egerena.com/themes/">
    <meta name="theme-color" content="#0d1117">
    <link rel="icon" type="image/png" sizes="16x16" href="/apps/egm-icon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/apps/egm-icon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/apps/egm-icon-192.png">
    <link rel="apple-touch-icon" href="/apps/egm-icon-180.png">
    <link rel="stylesheet" href="/fonts/fonts.css?v=1">
    <link rel="stylesheet" href="/apps/egm-downloader.css?v=@V_SITE_CSS@">
    <link rel="stylesheet" href="themes.css?v=@V_PAGE_CSS@">
    <script src="/apps/egm-downloader.js?v=@V_SITE_JS@"></script>
    <script src="app-data.js?v=@V_APP_DATA@"></script>
    <script src="themes.js?v=@V_PAGE_JS@"></script>
</head>
<body>
<!--@SITE_SKIP@-->
<!--@SITE_SPRITE@-->
<div class="page" id="top">

<!--@SITE_HEADER@-->

<main id="main">

<section class="wrap tp-hero">
    <h1>Try every theme.</h1>
    <p class="lead">Every theme in the app, previewed on its real layout. Open Themes in the window, or browse them all.</p>
</section>

<section class="tp-stage-wrap" aria-label="App preview">
    <div class="tp-stage" id="tp-stage">
        <div class="tp-host tp-host-win" id="tp-win-host"></div>
        <div class="tp-host tp-host-atw" id="tp-atw-host" hidden></div>
    </div>
    <p class="tp-note">A preview of the app's layout with sample downloads. Titles, channels and pictures are made up.</p>
</section>

<!-- The app preview lives in shadow roots (themes.js), so the site's styles and the app's styles never meet -->
<template id="tp-win-tpl">
    <link rel="stylesheet" href="app.css?v=@V_APP_CSS@">
    <link rel="stylesheet" href="preview.css?v=@V_PREVIEW_CSS@">
    <div class="egm egm-w tp-win" id="tp-win" dir="ltr" lang="en">
        <div class="egm-main" id="tp-main">
<!--@APP_WINDOW@-->
        </div>
<!--@CREATOR@-->
    </div>
</template>
<template id="tp-atw-tpl">
    <link rel="stylesheet" href="app.css?v=@V_APP_CSS@">
    <link rel="stylesheet" href="preview.css?v=@V_PREVIEW_CSS@">
    <div class="egm egm-a tp-atw" id="tp-atw" dir="ltr" lang="en">
        <div class="egm-atw">
<!--@ALL_THEMES@-->
        </div>
    </div>
</template>

</main>

<!--@SITE_FOOTER@-->

</div>
</body>
</html>
